network:
  inp_path: "data/networks/chico_hydro-qx1/SWMM - Chico (PVC) Prueba 1 - Qx1.00.inp"
  name: "Chico Sur"

simulation:
  factor_min: 0.2
  factor_max: 5.0
  factor_step: 0.2
  hydrograph_shapes_dir: "data/hydrograph_shapes"

dataset:
  output_path: "data/training/dataset_final.csv"
  db_path: "outputs/training_v17.sqlite3"
  flood_threshold_m3: 1.0

validation:
  drain_down_hours: 6.0
  inflow_closure_tolerance_lps: 0.01
  csv_inflow_closure_mode: "strict"
  drainage_inflow_tolerance_lps: 0.01
  drainage_flooding_tolerance_lps: 0.01
  drainage_storage_change_tolerance_m3: 0.01
  drainage_tail_window_hours: 1.0
  max_continuity_error_pct: 5.0
  drainage_extension_increment_hours: 2.0
  drainage_extension_max_retries: 2

ml:
  classifier:
    algorithm: "xgboost"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    scale_pos_weight: "auto"
  regressor:
    algorithm: "xgboost"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
  use_scaler: false

evaluation:
  methods:
    - "LOSO"
    - "GroupKFold5"
  stratify_by_factor: true

visualization:
  factors_to_plot: [1.4, 1.6, 2.0, 3.0, 5.0]
  colormap: "RdBu_r"
  output_path: "outputs/maps/"
  show_labels_top_n: 5

bench:
  protocols: ["LeaveOneShapeOut", "LOSO", "GroupKFold5"]
  ranking:
    primary_metric: "end_to_end.rmse_vol_todos_nodos"
    primary_direction: "minimize"
    tie_breakers:
      - {metric: "classifier.f1", direction: "maximize"}
      - {metric: "regressor_oracle.nse", direction: "maximize"}
  promote: "none"
  tuning:
    n_trials: 50
    n_splits: 5
    # Equal-weight network RMSE for the explicit nested transfer evaluation.
    objective: "macro_network_rmse"
  reporting:
    # A-only volume quartiles; reporting strata, not hydraulic severity limits.
    volume_band_edges_m3: [24.0, 108.0, 344.0]
  families:
    xgboost:
      enabled: true
      # Justificacion: valores heredados del pipeline validado en 2026-06.
      # Profundidad 6 y lr 0.05 con 200 arboles evitan sobreajuste sobre los
      # 175 escenarios sin perder capacidad en los factores extremos.
      classifier: {n_estimators: 200, max_depth: 6, learning_rate: 0.05, subsample: 0.8}
      regressor: {n_estimators: 200, max_depth: 6, learning_rate: 0.05, subsample: 0.8}
    random_forest:
      enabled: true
      # Justificacion: mismo numero de arboles y profundidad que XGBoost para
      # que la comparacion aisle el metodo (boosting vs bagging), no el tamano.
      classifier: {n_estimators: 200, max_depth: 6}
      regressor: {n_estimators: 200, max_depth: 6}
    linear:
      enabled: true
      # Justificacion: baseline. alpha=1.0 y C=1.0 son los valores por defecto
      # de sklearn; el objetivo es medir cuanto aporta la no-linealidad, no
      # exprimir el modelo lineal.
      classifier: {C: 1.0, max_iter: 5000}
      regressor: {alpha: 1.0}
    svm:
      enabled: true
      # SVM aproximado: Nystroem (mapeo RBF) + SVM lineal de margen (hinge,
      # SGD) con calibracion de Platt para predict_proba; el regresor es un
      # SVR lineal (epsilon-insensible) sobre el mismo mapeo. SVC/SVR exactos
      # son O(n^2)-O(n^3) e inviables con ~154 000 filas; el nombre interno
      # "svm" se conserva por compatibilidad con el registro.
      # gamma~=1/17 reproduce "scale" tras estandarizar las 17 features del banco.
      classifier: {gamma: 0.05, n_components: 200, alpha: 0.0001, max_iter: 2000, tol: 0.001}
      regressor: {gamma: 0.05, n_components: 200, alpha: 0.0001, epsilon: 0.1, max_iter: 2000, tol: 0.001}
    mlp:
      enabled: true
      # Justificacion: dos capas ocultas (64, 32) sobre 17 features es una
      # capacidad holgada sin llegar a memorizar; 200 epocas con Adam a 1e-3
      # convergen en este tamano de dataset. Pendiente de afinar con Optuna.
      classifier: {hidden_sizes: [64, 32], epochs: 200, learning_rate: 0.001, batch_size: 256, dropout: 0.1}
      regressor: {hidden_sizes: [64, 32], epochs: 200, learning_rate: 0.001, batch_size: 256, dropout: 0.1}
