# 7-shape training config (base + 6 hydrograph shapes × 25 factors = 28,000 rows)
# To regenerate: swap this file for config.yaml and run:
#   python main.py                  (simulate + train + evaluate)
#   python main.py --evaluate-shapes (SWMM vs ML figures for all 7 shapes)
#   python main.py --analyze-features (correlation, ablation, SHAP)
network:
  inp_path: "data/networks/chico_hydro-qx1/SWMM - Chico (PVC) Prueba 1 - Qx1.00.inp"
  name: "Chico Sur"

simulation:
  factor_min: 0.2
  factor_max: 5.0
  factor_step: 0.2
  hydrograph_shapes_dir: "data/hydrograph_shapes"

dataset:
  output_path: "data/training/dataset_final.csv"
  flood_threshold_m3: 1.0

validation:
  drain_down_hours: 6.0

ml:
  classifier:
    algorithm: "xgboost"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    scale_pos_weight: "auto"
  regressor:
    algorithm: "xgboost"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
  use_scaler: false

evaluation:
  methods:
    - "LOSO"
    - "GroupKFold5"
  stratify_by_factor: true

visualization:
  factors_to_plot: [1.4, 1.6, 2.0, 3.0, 5.0]
  colormap: "RdBu_r"
  output_path: "outputs/maps/"
  show_labels_top_n: 5
